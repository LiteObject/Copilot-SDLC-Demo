sdlc_config_schema: 2
stack:
  languages: [javascript]
  frameworks: []
  package_manager: none
  package_manifest: none
testing:
  framework: ""
  directories:
    - missing-tests/
validation:
  required_tasks: [build]
  optional_tasks: []
  install_task: install
quality_security:
  risk_profile: low
  required_test_layers: [unit]
  acceptance_mapping_required: true
security:
  review_required: false
  tasks: []
  blocking_severities: [critical, high]
tasks:
  build:
    executable: bash
    args: [--version]
