sdlc_config_schema: 1
stack:
  languages: [javascript]
  frameworks: []
  package_manager: none
  package_manifest: none
testing:
  framework: smoke
  directories:
    - tests/
validation:
  required_tasks: [build, test]
  optional_tasks: []
  install_task: none
  evidence_directory: .sdlc/evidence
quality_security:
  risk_profile: low
  required_test_layers: [unit]
  acceptance_mapping_required: true
security:
  review_required: false
  tasks: []
  blocking_severities: [critical, high]
tasks:
  build:
    executable: "bash;rm"
    args: [--version]
  test:
    executable: bash
    args: [--version]
