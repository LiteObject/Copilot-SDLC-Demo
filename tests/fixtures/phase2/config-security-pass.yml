sdlc_config_schema: 1
stack:
  languages: [shell]
  frameworks: []
  package_manager: none
  package_manifest: none
testing:
  framework: smoke
  directories:
    - tests/
validation:
  required_tasks: [build, test]
  optional_tasks: []
  install_task: none
  evidence_directory: .sdlc/evidence
quality_security:
  risk_profile: medium
  required_test_layers: [unit, integration]
  acceptance_mapping_required: true
security:
  review_required: true
  tasks: [secrets]
  blocking_severities: [critical, high]
tasks:
  build:
    executable: bash
    args: [--version]
  test:
    executable: bash
    args: [--version]
  secrets:
    executable: bash
    args: [--version]
