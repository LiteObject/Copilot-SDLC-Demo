name: AI Product Lifecycle

on:
    workflow_dispatch:
    schedule:
        - cron: "47 4 * * 1"

permissions:
    contents: read

jobs:
    ai-lifecycle:
        name: Validate AI product lifecycle controls
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Detect AI lifecycle
              id: ai-lifecycle-config
              shell: bash
              run: |
                  enabled=false
                  if awk '/^ai_lifecycle:/{found=1; next} found && /^[^[:space:]]/{exit} found && /enabled:[[:space:]]*true/{enabled=1} END { if (enabled) print "true" }' .github/sdlc-config.yml | grep -q true; then
                    enabled=true
                  fi
                  echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

            - name: Validate AI lifecycle contract
              if: steps.ai-lifecycle-config.outputs.enabled == 'true'
              shell: bash
              run: bash scripts/validate-ai-lifecycle.sh

            - name: Run evaluation, red team, and production exercise
              if: steps.ai-lifecycle-config.outputs.enabled == 'true'
              shell: bash
              run: bash scripts/run-ai-lifecycle.sh --record-spec

            - name: Upload AI lifecycle evidence
              if: always() && steps.ai-lifecycle-config.outputs.enabled == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: ai-lifecycle-${{ github.run_id }}
                  path: .sdlc/evidence/
                  if-no-files-found: warn
