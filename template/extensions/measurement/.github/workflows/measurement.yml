name: Measurement and Continuous Improvement

on:
    workflow_dispatch:
    schedule:
        - cron: "17 4 1 1,4,7,10 *"

permissions:
    contents: read

jobs:
    measurement:
        name: Run outcome measurement review
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Detect measurement
              id: measurement-config
              shell: bash
              run: |
                  enabled=false
                  if awk '/^measurement:/{found=1; next} found && /^[^[:space:]]/{exit} found && /enabled:[[:space:]]*true/{enabled=1} END { if (enabled) print "true" }' .github/sdlc-config.yml | grep -q true; then
                    enabled=true
                  fi
                  echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

            - name: Validate measurement contract
              if: steps.measurement-config.outputs.enabled == 'true'
              shell: bash
              run: bash scripts/validate-measurement.sh

            - name: Run baseline, snapshot, and process review
              if: steps.measurement-config.outputs.enabled == 'true'
              shell: bash
              run: bash scripts/run-measurement.sh --record-spec

            - name: Upload measurement evidence
              if: always() && steps.measurement-config.outputs.enabled == 'true'
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: measurement-${{ github.run_id }}
                  path: .sdlc/evidence/
                  if-no-files-found: warn
