name: Release Rollback

on:
    workflow_dispatch:
        inputs:
            incident_reference:
                description: Incident or change reference for the rollback record
                required: true
                type: string

permissions:
    contents: read

jobs:
    rollback:
        name: Execute production rollback
        runs-on: ubuntu-latest
        environment:
            name: production
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Validate release configuration
              shell: bash
              run: bash scripts/validate-release-config.sh

            - name: Execute rollback task
              shell: bash
              env:
                  INCIDENT_REFERENCE: ${{ inputs.incident_reference }}
              run: |
                  printf 'Rollback reference: %s\n' "$INCIDENT_REFERENCE" | tee .sdlc/evidence/rollback-change.log
                  bash scripts/run-sdlc-task.sh --task rollback --record-spec

            - name: Upload rollback evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: rollback-evidence-${{ github.run_id }}
                  path: .sdlc/evidence/
                  if-no-files-found: warn
