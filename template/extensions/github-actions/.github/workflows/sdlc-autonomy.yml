# SDLC Autonomy Workflow
# =======================
# Optional: validates the configured SDLC task registry for issues carrying the
# copilot:fix label. This workflow does not itself invoke the Copilot coding
# agent or create a pull request.
#
# To trigger: add the "copilot:fix" label to any issue in this repo.
# Configure any Copilot coding-agent assignment separately. This workflow
# validates config, installs dependencies, runs named tasks, retains evidence,
# and reports the result.
#
# Prerequisites:
#   - Repo must be hosted on GitHub.
#   - The "copilot:fix" label must exist in the repo.
#   - `integrations.copilot_coding_agent` must be `true` in .github/sdlc-config.yml.
#   - A versioned task registry must be configured in .github/sdlc-config.yml.

name: SDLC Autonomy Loop

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  copilot-fix:
    if: ${{ github.event.label.name == 'copilot:fix' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install -q pyyaml

      - name: Check integration configuration
        id: config
        run: |
          if [ ! -f .github/sdlc-config.yml ]; then
            echo "::error::.github/sdlc-config.yml not found."
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "status=invalid" >> $GITHUB_OUTPUT
            exit 1
          fi
          ENABLED=$(python -c "import yaml; d=yaml.safe_load(open('.github/sdlc-config.yml')) or {}; print('true' if d.get('integrations',{}).get('copilot_coding_agent') else 'false')")
          echo "enabled=$ENABLED" >> $GITHUB_OUTPUT
          if [ "$ENABLED" = "false" ]; then
            echo "status=disabled" >> $GITHUB_OUTPUT
            echo "::warning::integrations.copilot_coding_agent is not enabled in .github/sdlc-config.yml"
            exit 0
          fi
          echo "status=ready" >> $GITHUB_OUTPUT

      - name: Validate SDLC config and run named tasks
        if: steps.config.outputs.status == 'ready'
        run: |
          bash ./scripts/run-sdlc-task.sh --task all --record-spec

      - name: Run security scan policy
        if: steps.config.outputs.status == 'ready'
        run: |
          bash ./scripts/run-security-scans.sh --record-spec

      - name: Upload validation evidence
        if: always() && steps.config.outputs.status == 'ready'
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-validation-${{ github.run_id }}
          path: .sdlc/evidence/
          if-no-files-found: warn

      - name: Post result comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const configStatus = '${{ steps.config.outputs.status }}';
            const issueNumber = context.payload.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = configStatus === 'disabled'
              ? `ℹ️ **SDLC Autonomy Loop skipped.** The Copilot coding-agent integration is disabled, so no tests were run. [View run](${runUrl})`
              : outcome === 'success'
              ? `✅ **SDLC Autonomy Loop completed.** The configured tests passed. [View run](${runUrl})`
              : `❌ **SDLC Autonomy Loop failed.** Check the [workflow run](${runUrl}) for details.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body
            });
