# Template payload manifest.
# The scaffold installers validate template/base against base.installs below;
# update this list whenever a base file is added, removed, or renamed.
template:
  name: copilot-sdlc
  version: 1.0.0
  description: VS Code Copilot AI-SDLC customization payload.

base:
  path: base
  installs:
    - .github/copilot-instructions.md
    - .github/sdlc-config.yml
    - .github/agents/
    - .github/instructions/
    - .github/prompts/
    - docs/spec.md
    - scripts/check-phase.ps1
    - scripts/check-phase.sh
    - scripts/migrate-spec.ps1
    - scripts/migrate-spec.sh
    - scripts/validate-sdlc-config.ps1
    - scripts/validate-sdlc-config.sh
    - scripts/run-sdlc-task.ps1
    - scripts/run-sdlc-task.sh
    - scripts/run-security-scans.ps1
    - scripts/run-security-scans.sh
    - scripts/scope-audit.ps1
    - scripts/scope-audit.sh

extensions:
  frontend:
    path: extensions/frontend
    description: Frontend UX and accessibility standards.
  deployment-readiness:
    path: extensions/deployment-readiness
    description: Pre-deployment readiness checklist and guidance.
  github-actions:
    path: extensions/github-actions
    description: Optional issue-triggered GitHub Actions validation workflow.
  release-assurance:
    path: extensions/release-assurance
    description: Artifact, SBOM, provenance, promotion, smoke-test, and rollback assurance.
  operational-readiness:
    path: extensions/operational-readiness
    description: Observability, service objectives, incident response, runbooks, and production feedback controls.
  ai-governance:
    path: extensions/ai-governance
    description: AI-assisted development policy, least-privilege permissions, prompt-injection resistance, audit ledger, and agent evaluation controls.

ownership:
  template_owned:
    - .github/copilot-instructions.md
    - .github/agents/**
    - .github/instructions/**
    - .github/prompts/**
    - .github/workflows/**
    - scripts/check-phase.ps1
    - scripts/check-phase.sh
    - scripts/migrate-spec.ps1
    - scripts/migrate-spec.sh
    - scripts/validate-sdlc-config.ps1
    - scripts/validate-sdlc-config.sh
    - scripts/run-sdlc-task.ps1
    - scripts/run-sdlc-task.sh
    - scripts/run-security-scans.ps1
    - scripts/run-security-scans.sh
    - scripts/scope-audit.ps1
    - scripts/scope-audit.sh
  project_owned:
    - .github/sdlc-config.yml
    - docs/spec.md
    - src/**
    - tests/**
