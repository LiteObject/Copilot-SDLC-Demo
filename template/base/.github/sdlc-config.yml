#    args: [scan, --json, --config, auto]
#  secrets:
#    executable: gitleaks
#    args: [detect, --no-banner]

# ── Conventions ─────────────────────────────────────
conventions:
  # Line length target (if your formatter enforces one).
  max_line_length: 120

  # Indentation style.
  indent: spaces  # spaces | tabs

  # Quote style preference.
  quotes: single   # single | double

  # Semicolons?
  semicolons: true

# ── Integrations ────────────────────────────────────
integrations:
  # Enable PR-based autonomous test/fix loop via GitHub Copilot coding agent.
  # Requires the repo to be hosted on GitHub.
  copilot_coding_agent: false

  # Enable the deployment readiness gate before DONE.
  deployment_readiness_gate: false

# ── Design System (frontend/UI projects only) ───────
design_system:
  # CSS framework or design system in use.
  framework: ""
  # Examples: tailwind, bootstrap, material-ui, custom

  # Accessibility target.
  a11y_target: WCAG 2.1 AA
