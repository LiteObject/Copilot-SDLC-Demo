# SDLC Configuration
# ==================
# Single source of truth for stack-specific settings.
# Every agent reads this via the shared copilot-instructions.md reference.
#
# From the template authoring repository, scaffold this into your project with:
#   ./tools/scaffold-sdlc.ps1 -Target ../my-project
# Then edit this file to match your stack.
sdlc_config_schema: 1

# ── Stack ───────────────────────────────────────────
stack:
  # Primary languages used in this project.
  languages: []
  # Example: [typescript, python]

  # Frameworks in use (frontend and backend).
  frameworks: []
  # Example: [react, fastapi]

  # Package manager / build tool.
  package_manager: npm
  # Supported values: npm, yarn, pnpm, pip, poetry, cargo, dotnet, go, none.
  package_manifest: package.json

# ── Testing ─────────────────────────────────────────
testing:
  # Test framework the QA agent should use.
  framework: ""
  # Examples: jest, pytest, vitest, xunit, go test

  # Directories containing test files (relative to repo root).
  directories:
    - tests/

# ── Linting & Formatting ────────────────────────────
linting:
  # Formatter commands (one per language or tool).
  formatters: []
  # Examples: [prettier --write src/, black .]

# ── Validation ─────────────────────────────────────
# Required tasks must pass. Optional tasks are run when listed; omit lint or
# type_check when the selected stack has no applicable tool.
validation:
  required_tasks: [build, test]
  optional_tasks: [lint, type_check]
  install_task: install
  evidence_directory: .sdlc/evidence

# ── Quality & Security ─────────────────────────────
quality_security:
  risk_profile: low  # low | medium | high | critical
  required_test_layers: [unit]
  acceptance_mapping_required: true

security:
  review_required: false
  tasks: []
  blocking_severities: [critical, high]

# ── Meaningful Verification ────────────────────────
# Coverage and mutation checks are risk-based. Enable a check and configure its
# named task when the selected risk profile requires it. Reports must include
# commit_sha and tree_digest metadata for the source revision they measure.
verification:
  coverage_enabled: false
  coverage_task: coverage
  coverage_provider: coverage-py-json
  coverage_report_path: .sdlc/reports/coverage.json
  coverage_changed_line_threshold: 80
  coverage_excluded_paths: [tests/**, generated/**]
  coverage_required_risk_profiles: [medium, high, critical]
  mutation_enabled: false
  mutation_task: mutation
  mutation_provider: generic-json
  mutation_report_path: .sdlc/reports/mutation.json
  mutation_threshold: 80
  mutation_excluded_paths: []
  mutation_required_risk_profiles: []

# ── Release Assurance ──────────────────────────────
# Opt-in for repositories that produce deployable artifacts.
release_assurance:
  enabled: false
  artifact_task: package
  artifact_path: .sdlc/release/artifact.tar.gz
  sbom_task: sbom
  sbom_path: .sdlc/release/sbom.cdx.json
  sbom_format: cyclonedx-json
  require_provenance: true
  provenance_path: .sdlc/release/provenance.json
  require_signed_artifact: false
  signing_task: sign
  signature_path: .sdlc/release/artifact.sig
  deployment_task: deploy
  smoke_test_task: smoke_test
  rollback_task: rollback
  release_notes_path: .sdlc/release/RELEASE_NOTES.md
  rollback_instructions_path: .sdlc/release/ROLLBACK.md
  promotion_environments: [development, staging, production]
  required_approvals: [reviewer, release_manager]
  deployment_window: ""

# ── Operational Readiness ──────────────────────────
# Opt-in for repositories that operate deployed services.
operational_readiness:
  enabled: false
  service_name: ""
  service_owner: ""
  on_call: ""
  health_endpoint: /health
  required_telemetry: [structured_logs, metrics, distributed_traces, correlation_ids]
  required_slis: [availability, latency, error_rate, throughput, business_outcome]
  slo_availability: ""
  slo_latency: ""
  slo_error_rate: ""
  slo_throughput: ""
  slo_business_outcome: ""
  readiness_review_items: [capacity, backup_recovery, dependency_failure, data_retention, privacy, disaster_recovery]
  incident_severities: [sev1, sev2, sev3, sev4]
  retention_days: 30
  readiness_review_path: docs/operational-readiness.md
  incident_response_path: docs/incident-response.md
  alert_policy_path: docs/alert-policy.md
  escalation_policy_path: docs/escalation-policy.md
  runbooks: [docs/runbooks/high-error-rate.md, docs/runbooks/degraded-dependency.md, docs/runbooks/rollback.md, docs/runbooks/secret-rotation.md, docs/runbooks/feature-disablement.md]
  feedback_path: .sdlc/evidence/production-outcome.json
  incident_record_path: .sdlc/evidence/incident-review.json
  health_check_task: health_check
  telemetry_check_task: telemetry_check
  failure_drill_task: failure_drill
  post_release_check_task: post_release_check

# Opt-in governance for repositories that use coding agents, MCP servers, or
# other AI-assisted development tools.
ai_governance:
  enabled: false
  policy_path: docs/ai-assisted-development-policy.md
  permissions_path: docs/agent-permissions.md
  threat_model_path: docs/prompt-injection-threat-model.md
  evaluation_plan_path: docs/agent-evaluation-plan.md
  evaluation_scenarios_path: docs/agent-evaluation-scenarios.md
  ledger_path: .sdlc/evidence/ai-change-ledger.jsonl
  evaluation_evidence_path: .sdlc/evidence/agent-evaluation.json
  retention_days: 90
  audit_retention_days: 90
  approved_providers: [github, azure-openai]
  approved_models: [GPT-5]
  approved_tenants: [default-tenant]
  permitted_repositories: [this-repository]
  allowed_data_classifications: [public, internal, confidential]
  prohibited_inputs: [secrets, credentials, personal_data, untrusted_instructions]
  tool_allowlist: [read, search, edit]
  mcp_server_allowlist: []
  network_destination_allowlist: []
  credential_scope_allowlist: []
  phase_tool_grants: [GATHERING_REQS=read|search, DESIGN=read|search, PLANNING=read|search|edit, CODING=read|search|edit, REVIEW=read|search, TESTING=read|search|edit, DEPLOYMENT_READINESS=read|search, DONE=read|search]
  restricted_actions: [commit, merge, deploy, rotate_credentials, production_config]
  approval_required_actions: [commit, merge, deploy, rotate_credentials, production_config]
  sandbox_required: true
  sandbox_type: worktree
  command_confirmation_required: true
  untrusted_input_policy: treat_as_data
  evaluation_task: agent_evaluation

# Opt-in lifecycle controls for products that expose or depend on AI.
ai_lifecycle:
  enabled: false
  risk_tier: low  # low | medium | high | critical
  risk_owner: ""
  intended_uses: []
  prohibited_uses: []
  affected_communities: []
  applicable_laws: []
  human_oversight: ""
  contestability: ""
  impact_assessment_path: docs/ai-impact-assessment.md
  inventory_path: docs/ai-system-inventory.md
  evaluation_plan_path: docs/ai-evaluation-plan.md
  evaluation_report_path: .sdlc/evidence/ai-evaluation.json
  risk_disposition_path: docs/ai-risk-disposition.md
  red_team_plan_path: docs/ai-red-team-plan.md
  runtime_controls_path: docs/ai-runtime-controls.md
  monitoring_plan_path: docs/ai-production-monitoring.md
  rollback_plan_path: docs/ai-rollback-plan.md
  decommissioning_plan_path: docs/ai-decommissioning-plan.md
  model_card_path: docs/ai-model-card.md
  system_card_path: docs/ai-system-card.md
  model_providers: []
  models: []
  prompt_versions: []
  system_instruction_versions: []
  tools: []
  retrieval_sources: []
  embeddings: []
  datasets: []
  evaluation_datasets: []
  safety_filters: []
  fallback_behavior: ""
  material_change_triggers: []
  required_metrics: []
  alert_thresholds: []
  monitoring_cadence: ""
  reevaluation_cadence: ""
  retention_days: 90
  require_red_team: true
  require_production_exercise: true
  tool_authorization_required: true
  least_privilege_required: true
  rate_limit_required: true
  cost_limit_required: true
  input_validation_required: true
  output_validation_required: true
  safety_filter_required: true
  pii_handling_required: true
  audit_log_required: true
  human_escalation_required: true
  kill_switch_required: true
  safe_fallback_required: true
  evaluation_task: ai_evaluation
  red_team_task: ai_red_team
  production_exercise_task: ai_production_exercise
  rollback_task: ai_rollback
  decommission_task: ai_decommission

# Opt-in measurement and continuous-improvement controls for every project.
measurement:
  enabled: false
  require_completion_gate: false
  owner: ""
  cadence: quarterly
  retention_days: 365
  measurement_plan_path: docs/measurement-plan.md
  baseline_path: docs/measurement-baseline.md
  metric_catalog_path: docs/measurement-metrics.md
  privacy_review_path: docs/measurement-privacy-review.md
  improvement_log_path: docs/continuous-improvement-log.md
  quarterly_review_path: docs/quarterly-process-review.md
  snapshot_path: .sdlc/evidence/measurement-snapshot.json
  baseline_task: measurement_baseline
  snapshot_task: measurement_snapshot
  review_task: measurement_review
  baseline_metrics: [lead_time, deployment_frequency, change_failure_rate, recovery_time, escaped_defects, security_findings, review_cycle_count, flaky_test_rate, rollback_rate]
  delivery_metrics: [complete_evidence_rate, agent_suggested_defect_rate, human_rework, review_acceptance_rate, scope_drift_rate, validation_pass_rate, model_tool_policy_violations]
  ai_product_metrics_applicable: false
  ai_product_metrics: [task_quality, safety_rate, abstention_escalation_rate, user_reported_harms, cost, latency, drift, incident_recurrence]
  phase_outcome_metrics: [phase0_outcome, phase1_outcome, phase2_outcome, phase3_outcome, phase4_outcome, phase5_outcome, phase6_outcome, phase7_outcome]
  phase_leading_indicators: [phase0_leading_indicator, phase1_leading_indicator, phase2_leading_indicator, phase3_leading_indicator, phase4_leading_indicator, phase5_leading_indicator, phase6_leading_indicator, phase7_leading_indicator]

# Structured argv only. The runner invokes executable with args directly; it
# never evaluates a shell command string.
tasks:
  install:
    executable: npm
    args: [ci]
  build:
    executable: npm
    args: [run, build]
  test:
    executable: npm
    args: [test]
  lint:
    executable: npm
    args: [run, lint]
  type_check:
    executable: npm
    args: [run, typecheck]

# Configure this task when ai_governance.enabled is true. Keep the command
